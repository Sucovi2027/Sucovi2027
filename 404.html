<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sucovi 2027</title>
  <script>
    // GitHub Pages SPA redirect - preserva la base /Sucovi2027/
    var repo = '/Sucovi2027';
    var l = window.location;
    var path = l.pathname.replace(repo, '') || '/';
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      repo + '/?p=' + path.slice(1).replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>Redirigiendo...</body>
</html>
